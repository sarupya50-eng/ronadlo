name: Build Auralis Jamendo for Windows

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-clean

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build
      - run: npm run desktop:prepare
      - run: npx electron-builder --win nsis --x64

      - uses: actions/upload-artifact@v4
        with:
          name: Auralis-Jamendo-Windows-x64
          path: release/*.exe
          if-no-files-found: error
