
name: Build Auralis Jamendo for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout desktop app
        uses: actions/checkout@v4
        with:
          ref: desktop-clean

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Prepare desktop files
        run: npm run desktop:prepare

      - name: Verify Next.js dependency
        shell: pwsh
        run: |
          $p = "desktop/next-app/node_modules/next/package.json"
          if (!(Test-Path $p)) {
            Write-Error "Next.js is missing after preparation: $p"
            exit 1
          }
          Write-Host "Next.js dependency exists."
          Get-Content $p -TotalCount 5

      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-Jamendo-Windows-x64
          path: release/*.exe
          if-no-files-found: error
