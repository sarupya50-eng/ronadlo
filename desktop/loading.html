<!doctype html>
<html><head><meta charset="utf-8"><title>Auralis</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Segoe UI,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
.logo{width:72px;height:72px;border-radius:18px;background:#1ed760;color:#000;font-size:42px;font-weight:800;display:grid;place-items:center}
.bar{width:160px;height:4px;background:#222;border-radius:4px;overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:#1ed760;animation:m 1.1s infinite ease-in-out}
@keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style></head>
<body><div class="logo">A</div><div class="bar"><i></i></div><div style="color:#aaa;font-size:13px">Starting Auralis…</div></body></html>
